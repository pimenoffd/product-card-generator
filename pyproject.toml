[project]
name = "product-card-generator"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2,<3", "httpx>=0.27,<1", "streamlit>=1,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["product_cards*"]
